name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
          
    - name: Build and Install Core SDK
      run: |
        cd azure-servicebus
        mvn clean install -DskipTests -B
        
    - name: Package JMS Implementation
      run: |
        cd azure-servicebus-jms
        mvn clean package -DskipTests -B
        
    - name: Package JCA Implementation
      run: |
        cd azure-servicebus-jca
        mvn clean package -DskipTests -B
        
    - name: Create Source Bundle
      run: |
        tar -czf azure-servicebus-java-source-${{ github.sha }}.tar.gz \
          --exclude='.git*' \
          --exclude='target' \
          --exclude='*.log' \
          .
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-artifacts-${{ github.sha }}
        path: |
          azure-servicebus-jms/target/*.jar
          azure-servicebus-jca/target/*.rar
          azure-servicebus-java-source-${{ github.sha }}.tar.gz
          
    - name: Create Draft Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: release-${{ github.run_number }}
        release_name: Azure Service Bus Java Release ${{ github.run_number }}
        body: |
          ## Azure Service Bus Java SDK Release
          
          **Release Information:**
          - Commit: ${{ github.sha }}
          - Built: ${{ github.run_started_at }}
          
          **Artifacts:**
          - **JMS JAR**: `azure-servicebus-jms-*.jar` - JMS 2.0 Implementation
          - **JCA RAR**: `azure-servicebus-jca-*.rar` - JCA 1.7 Resource Adapter  
          - **Source Bundle**: `azure-servicebus-java-source-*.tar.gz` - Complete source code
          
          > Download artifacts from the Actions run and attach them to this release before publishing.
          
          ### Coverage Achieved: 77.4% line, 65.2% branch
        draft: true
        prerelease: false
