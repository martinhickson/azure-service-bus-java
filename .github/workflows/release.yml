name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
          
    - name: Build and Package All Modules
      run: |
        mvn clean package -DskipTests -B
        
    - name: Create Source Bundle
      run: |
        # Use git archive for clean, consistent source bundles
        git archive --format=tar.gz --prefix=azure-servicebus-java/ \
          -o azure-servicebus-java-source-${{ github.sha }}.tar.gz \
          HEAD
        
    - name: Create Draft Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: release-${{ github.run_number }}
        name: Azure Service Bus Java Release ${{ github.run_number }}
        body: |
          ## Azure Service Bus Java SDK Release
          
          **Release Information:**
          - Commit: ${{ github.sha }}
          - Built: ${{ github.run_started_at }}
          
          **Artifacts:**
          - **JMS JAR**: `azure-servicebus-jms-*.jar` - JMS 2.0 Implementation
          - **JCA RAR**: `azure-servicebus-jca-*.rar` - JCA 1.7 Resource Adapter  
          - **Source Bundle**: `azure-servicebus-java-source-*.tar.gz` - Complete source code
          
          ### Coverage Achieved: 77.4% line, 65.2% branch
        draft: true
        prerelease: false
        files: |
          azure-servicebus-jms/target/*.jar
          azure-servicebus-jca/target/*.rar
          azure-servicebus-java-source-${{ github.sha }}.tar.gz
