version: 2
updates:
  # Maven dependencies for all modules
  - package-ecosystem: "maven"
    directory: "/azure-servicebus"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    
  - package-ecosystem: "maven"
    directory: "/azure-servicebus-jms"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    
  - package-ecosystem: "maven"
    directory: "/azure-servicebus-jca"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
